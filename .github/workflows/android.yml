name: Build Android APK

# Build an installable debug APK in the cloud — no local Android tooling needed.
# Run it from GitHub → Actions → "Build Android APK" → Run workflow,
# or it runs automatically on every push to any branch.
#
# Branch-based environment routing:
#   main branch     → 'production' environment (prod Supabase project)
#   all other       → 'development' environment (dev Supabase project)
#
# REQUIRED: Create two GitHub Environments in repo Settings → Environments:
#   'development' with secrets:
#     VITE_SUPABASE_URL = https://uwlhnvlwfvwwaodfryda.supabase.co
#     VITE_SUPABASE_ANON_KEY = <dev Supabase anon key>
#   'production' with secrets:
#     VITE_SUPABASE_URL = https://wpdalidqkfsizgdvdbqi.supabase.co
#     VITE_SUPABASE_ANON_KEY = <prod Supabase anon key>
#
# Also requires repo secret GOOGLE_SERVICES_JSON_BASE64 (base64 of
# android/app/google-services.json) for Firebase Crashlytics.

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    outputs:
      environment_name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase secrets are set
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "ERROR: Supabase secrets not configured for this branch."
            echo "GitHub environment '${{ github.ref_name == 'main' && 'production' || 'development' }}' requires:"
            echo "  - VITE_SUPABASE_URL"
            echo "  - VITE_SUPABASE_ANON_KEY"
            echo ""
            echo "See the workflow file header for setup instructions."
            exit 1
          fi

      - name: Write env file
        run: |
          EXPECTED_ENV="${{ github.ref_name == 'main' && 'PRODUCTION' || 'DEVELOPMENT' }}"
          SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"

          echo "Environment: $EXPECTED_ENV (branch: ${{ github.ref_name }})"
          echo "Supabase URL: $SUPABASE_URL"
          echo ""

          # Verify production builds use prod Supabase
          if [[ "$EXPECTED_ENV" == "PRODUCTION" && ! "$SUPABASE_URL" =~ "wpdalidqkfsizgdvdbqi" ]]; then
            echo "⚠️  WARNING: Production build but not using production Supabase!"
            echo "Expected URL to contain: wpdalidqkfsizgdvdbqi"
            echo "Got: $SUPABASE_URL"
            echo ""
            echo "FIX: Check GitHub Settings → Environments → production"
            echo "and verify VITE_SUPABASE_URL = https://wpdalidqkfsizgdvdbqi.supabase.co"
            exit 1
          fi

          echo "VITE_SUPABASE_URL=$SUPABASE_URL" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local
          echo "✓ Configuration verified"

      - name: Build web app
        run: npm run build

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (manual)
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-9477386_latest.zip

          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          # Install API 36 + build-tools 36.0.0
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" --no_https

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: islam-seekho-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
