name: Build Android APK

# Build an installable debug APK in the cloud — no local Android tooling needed.
# Run it from GitHub → Actions → "Build Android APK" → Run workflow,
# or it runs automatically on every push to any branch.
#
# Branch-based environment routing:
#   main branch     → 'production' environment (prod Supabase project)
#   all other       → 'development' environment (dev Supabase project)
#
# REQUIRED: Create two GitHub Environments in repo Settings → Environments:
#   'development' with secrets:
#     VITE_SUPABASE_URL = https://uwlhnvlwfvwwaodfryda.supabase.co
#     VITE_SUPABASE_ANON_KEY = <dev Supabase anon key>
#   'production' with secrets:
#     VITE_SUPABASE_URL = https://wpdalidqkfsizgdvdbqi.supabase.co
#     VITE_SUPABASE_ANON_KEY = <prod Supabase anon key>

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Write env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (manual)
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-9477386_latest.zip

          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          # Install API 36 + build-tools 36.0.0
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" --no_https

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: islam-seekho-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
