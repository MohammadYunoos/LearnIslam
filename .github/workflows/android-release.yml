name: Build Android App Bundle (.aab)

# Builds a SIGNED release .aab for Play Store (Internal testing / production).
# Run from GitHub → Actions → "Build Android App Bundle (.aab)" → Run workflow.
# Manual only — a release should be deliberate.
#
# Branch-based environment routing:
#   main branch     → 'production' environment (prod Supabase project)
#   all other       → 'development' environment (dev Supabase project)
#
# Requires these repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD      key password
#   GOOGLE_SERVICES_JSON_BASE64  base64 of android/app/google-services.json (Firebase Crashlytics)
# See README-release notes below the workflow file for how to create them.
#
# REQUIRED: Create two GitHub Environments in repo Settings → Environments:
#   'development' with secrets:
#     VITE_SUPABASE_URL = https://uwlhnvlwfvwwaodfryda.supabase.co
#     VITE_SUPABASE_ANON_KEY = <dev Supabase anon key>
#   'production' with secrets:
#     VITE_SUPABASE_URL = https://wpdalidqkfsizgdvdbqi.supabase.co
#     VITE_SUPABASE_ANON_KEY = <prod Supabase anon key>

on:
  workflow_dispatch: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase secrets are set
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "ERROR: Supabase secrets not configured for this branch."
            echo "GitHub environment 'production' requires:"
            echo "  - VITE_SUPABASE_URL"
            echo "  - VITE_SUPABASE_ANON_KEY"
            echo ""
            echo "See the workflow file header for setup instructions."
            exit 1
          fi

      - name: Write env file
        run: |
          SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"

          echo "Environment: PRODUCTION (release build)"
          echo "Supabase URL: $SUPABASE_URL"
          echo ""

          # Verify release builds use prod Supabase
          if [[ ! "$SUPABASE_URL" =~ "wpdalidqkfsizgdvdbqi" ]]; then
            echo "❌ ERROR: Release build must use production Supabase!"
            echo "Expected URL to contain: wpdalidqkfsizgdvdbqi"
            echo "Got: $SUPABASE_URL"
            echo ""
            echo "FIX: Check GitHub Settings → Environments → production"
            echo "and verify VITE_SUPABASE_URL = https://wpdalidqkfsizgdvdbqi.supabase.co"
            exit 1
          fi

          echo "VITE_SUPABASE_URL=$SUPABASE_URL" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local
          echo "✓ Production Supabase verified"

      - name: Build web app
        run: npm run build

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (manual)
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-9477386_latest.zip

          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          # Install API 36 + build-tools 36.0.0
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" --no_https

      - name: Decode keystore + write key.properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: islam-seekho-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
